# =============================================================================
# nginx.conf — the Nginx config INSIDE the frontend container
# =============================================================================
# 🎯 WHAT THIS FILE DOES (plain English):
#   Tells Nginx how to serve the React app:
#     1. Listen on port 8080 and serve the built site (dist/)
#     2. For any path that isn't a real file → return index.html
#        (this is the "SPA fallback" so client-side routing works)
#     3. Forward any /api/* request to the backend container
#        (in production this replaces the Vite dev proxy from Milestone 2)
#     4. Compress responses (gzip) to make the site faster
#
# LINE-BY-LINE: read the `#` comments beside every line below.
# =============================================================================
server {
    listen       8080;                # the port users reach the site on
    server_name  _;                   # match ANY hostname (fine for a demo)

    root   /usr/share/nginx/html;     # folder where the built React files live
    index  index.html;                # default file to open

    location / {                      # for normal page requests ...
        try_files $uri $uri/ /index.html;   # ...if the file exists serve it, else index.html
    }

    location /api/ {                  # for API calls (starting with /api) ...
        proxy_pass http://backend:3000;     # ...forward them to the backend service (compose name!)
        proxy_set_header Host $host;              # keep original hostname
        proxy_set_header X-Real-IP $remote_addr;  # pass real client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # chain of IPs
        proxy_set_header X-Forwarded-Proto $scheme;                   # http or https
    }

    # Compress text-like responses → faster page loads
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}