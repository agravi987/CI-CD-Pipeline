# =============================================================================
# ci.yml — "CI — Lint, Test, Build & Scan"
# =============================================================================
# 🎯 WHAT THIS FILE DOES (plain English):
#   Every time you `git push` code OR open/update a pull request, GitHub rents
#   a fresh Linux computer (called a "runner") and runs this to-do list:
#
#     1. Backend tests   → start a PostgreSQL database, install packages, run tests
#     2. Frontend lint   → check code style, then build the React app
#     3. Docker + scan   → build both Docker images and security-scan them
#     4. Summary         → print "all green" at the end
#
#   If ANY step fails, the whole run turns red 🔴. Later (Milestone 13) a red
#   run even BLOCKS the merge button. That's the whole point of CI:
#   catch broken code BEFORE it ever reaches your users.
#
# LINE-BY-LINE: read the `#` comments beside every block below.
# =============================================================================

name: CI — Lint, Test, Build & Scan   # the name you see on the Actions page

# `on:`  =  WHEN should this workflow wake up? (these are called "events")
on:
  push:                                  # someone ran `git push` ...
    branches: [main, "feature/**", "dev/**"]   # ...but only to these branches
  pull_request:                          # someone opened / updated a Pull Request ...
    branches: [main]                     # ...and only if the PR targets `main`

# `env:`  =  variables shared by EVERY job in this file
env:
  REGISTRY: ghcr.io                                      # GitHub's image registry
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-backend  # backend image address
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-frontend  # frontend image address
  # ${{ github.repository_owner }} = the GitHub user/org that owns this repo

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — backend-tests
  #   Starts a real PostgreSQL database, installs backend packages, runs tests.
  # ─────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: "Backend — Test"          # human-friendly label on the Actions page
    runs-on: ubuntu-latest          # which OS the virtual runner should use
    services:                       # "services" = helper containers THIS job gets
      postgres:                     #   we name the helper "postgres"
        image: postgres:16-alpine   #   the official PostgreSQL container
        env:                        #   first-time setup Postgres needs
          POSTGRES_USER: appuser      #   create a user called "appuser"
          POSTGRES_PASSWORD: testpass #   give it this password (test-only values)
          POSTGRES_DB: appdb          #   create a database named "appdb"
        ports:
          - 5432:5432                #   make it reachable on the usual port 5432
        # the "healthcheck" rules Docker uses before calling the DB ready:
        #   --health-cmd        "ready" = this command answers OK
        #   --health-interval   ask every 5 seconds
        #   --health-timeout    wait at most 5s for an answer
        #   --health-retries    only call it healthy after 5 good answers
        options: >-
          --health-cmd "pg_isready -U appuser -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:                            # env vars passed to THIS job's shell
      DB_HOST: localhost            #   the DB lives on the same runner here
      DB_PORT: 5432                 #   ...on port 5432
      DB_USER: appuser              #   match the user created above
      DB_PASSWORD: testpass         #   match the password created above
      DB_NAME: appdb                #   match the database created above
    steps:                          # `steps:` = the to-do list, top to bottom
      - uses: actions/checkout@v4   # step 1: download your repo code
      - uses: actions/setup-node@v4 # step 2: install Node.js
        with:
          node-version: 22          #   version 22 (what the app needs)
          cache: npm                #   reuse npm cache → faster future runs
          cache-dependency-path: ci-cd-pipeline-app/backend/package-lock.json
      - name: Install dependencies
        run: npm ci                 # step 3: clean `npm install` from lockfile
        working-directory: ci-cd-pipeline-app/backend  # run inside the backend folder
      - name: Run unit + integration tests
        run: npm test               # step 4: run ALL tests
        working-directory: ci-cd-pipeline-app/backend

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — frontend-lint-build
  #   Installs frontend packages, checks code style, builds the React app.
  # ─────────────────────────────────────────────────────────────────────────
  frontend-lint-build:
    name: "Frontend — Lint & Build"   # label on the Actions page
    runs-on: ubuntu-latest            # separate runner = runs in PARALLEL with job 1
    steps:
      - uses: actions/checkout@v4     # step 1: download the repo code
      - uses: actions/setup-node@v4   # step 2: install Node.js
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci-cd-pipeline-app/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ci-cd-pipeline-app/frontend
      - name: Lint
        run: npm run lint            # step 4: check code style (ESLint)
        working-directory: ci-cd-pipeline-app/frontend
      - name: Build production bundle
        run: npm run build           # step 5: compile React → static files (dist/)
        working-directory: ci-cd-pipeline-app/frontend
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4  # step 6: save the build so humans can download it
        with:
          name: frontend-dist        #   name of the downloadable "artifact"
          path: ci-cd-pipeline-app/frontend/dist/

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — docker-build-scan
  #   Waits for jobs 1+2 (`needs:`), then builds BOTH Docker images and
  #   security-scans them with Trivy.
  # ─────────────────────────────────────────────────────────────────────────
  docker-build-scan:
    name: "Docker — Build & Security Scan"
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint-build]  # don't start until these two pass
    permissions:                    # ask GitHub for the access this job needs
      contents: read                #   can read the repo (needed to checkout)
      security-events: write        #   can write security results (code scanning)
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3   # enable modern Docker image building

      - name: Build backend image
        uses: docker/build-push-action@v6     # build the backend Dockerfile
        with:
          context: ci-cd-pipeline-app/backend   # folder containing the Dockerfile
          target: runtime                       # build the "runtime" stage only
          load: true                            # keep image on this runner (for scanning)
          tags: cicd-backend:ci                 # give it a temporary name:tag
          cache-from: type=gha                  # reuse cached layers from earlier runs
          cache-to: type=gha,mode=max           # save new layers to the cache

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ci-cd-pipeline-app/frontend
          target: serve                         # build the nginx "serve" stage
          load: true
          tags: cicd-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@0.28.0  # security scanner
        with:
          image-ref: cicd-backend:ci            #   scan the image we just built
          format: table                         #   print findings as a table
          severity: CRITICAL,HIGH               #   only worry about the worst two levels
          exit-code: 1                          #   ⛔ fail the job if problems found
          ignore-unfixed: true                  #   ignore CVEs that have no fix yet

      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cicd-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Save Trivy SBOM — backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cicd-backend:ci
          format: cyclonedx                      # SBOM = inventory of every package
          output: sbom-backend.json              #   save it to a file
      - name: Save Trivy SBOM — frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cicd-frontend:ci
          format: cyclonedx
          output: sbom-frontend.json

      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@v4         # make the SBOMs downloadable
        with:
          name: sboms
          path: sbom-*.json

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4 — ci-complete (the "all green" crown)
  #   Only runs when EVERY job above succeeded. Its job is simply to say so.
  # ─────────────────────────────────────────────────────────────────────────
  ci-complete:
    name: "CI Passed"
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint-build, docker-build-scan]
    steps:
      - name: All checks passed
        run: echo "✅ CI pipeline completed successfully — lint, tests, build, security scan all green."