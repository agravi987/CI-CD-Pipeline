name: CI — Lint, Test, Build & Scan

on:
  push:
    branches: [main, "feature/**", "dev/**"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-frontend

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1 — Backend: install, lint, unit tests
  # ─────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: "Backend — Test"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: appuser
      DB_PASSWORD: testpass
      DB_NAME: appdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci-cd-pipeline-app/backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ci-cd-pipeline-app/backend

      - name: Run unit + integration tests
        run: npm test
        working-directory: ci-cd-pipeline-app/backend

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2 — Frontend: install, lint, build
  # ─────────────────────────────────────────────────────────────────────────
  frontend-lint-build:
    name: "Frontend — Lint & Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci-cd-pipeline-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ci-cd-pipeline-app/frontend

      - name: Lint
        run: npm run lint
        working-directory: ci-cd-pipeline-app/frontend

      - name: Build production bundle
        run: npm run build
        working-directory: ci-cd-pipeline-app/frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ci-cd-pipeline-app/frontend/dist/

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3 — Docker images: build both, scan with Trivy
  # ─────────────────────────────────────────────────────────────────────────
  docker-build-scan:
    name: "Docker — Build & Security Scan"
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint-build]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ci-cd-pipeline-app/backend
          target: runtime
          load: true
          tags: cicd-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ci-cd-pipeline-app/frontend
          target: serve
          load: true
          tags: cicd-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cicd-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cicd-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Save Trivy SBOM — backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cicd-backend:ci
          format: cyclonedx
          output: sbom-backend.json

      - name: Save Trivy SBOM — frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cicd-frontend:ci
          format: cyclonedx
          output: sbom-frontend.json

      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom-*.json

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4 — Summary
  # ─────────────────────────────────────────────────────────────────────────
  ci-complete:
    name: "CI Passed"
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint-build, docker-build-scan]
    steps:
      - name: All checks passed
        run: echo "✅ CI pipeline completed successfully — lint, tests, build, security scan all green."
