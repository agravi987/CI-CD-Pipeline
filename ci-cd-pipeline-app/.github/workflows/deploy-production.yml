# =============================================================================
# deploy-production.yml — "Deploy to Production"
# =============================================================================
# 🎯 WHAT THIS FILE DOES (plain English):
#   Much like staging, but with extra guardrails — because REAL users are here.
#     1. Runs under the `production` environment, which (from Milestone 9) is
#        set to PAUSE and ask a human for APPROVAL before actually deploying.
#     2. Deploys a chosen version tag (v1.2.3, sha-abc1234, or "latest").
#     3. SSHes into your PRODUCTION server, pulls images, restarts, health-checks.
#
#   Difference from staging in one line:
#     staging = automatic on every merge      production = tag + human approval.
#
# LINE-BY-LINE: read the `#` comments beside every block below.
# =============================================================================
name: Deploy to Production       # name shown on the Actions page

# WHEN does this workflow fire?
on:
  workflow_dispatch:             # a human clicked "Run workflow"
    inputs:                      #   ...with a form for choosing the image tag
      version:
        description: "Image tag to deploy (e.g. v1.2.3, sha-abc1234, latest)"
        required: false          #   optional — defaults to "latest" below
        default: latest
  workflow_call:                 # another workflow asked us to run
    secrets:
      PROD_SSH_KEY:
        required: true
      PROD_HOST:
        required: true

# Shared variables
env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-frontend

jobs:
  deploy-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    environment: production      # ← ⭐ THIS line triggers the human approval gate (Milestone 9)
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          # Rule 1: a human typed a specific version? → use exactly that tag
          if [ "${{ github.event.inputs.version }}" != "" ] && [ "${{ github.event.inputs.version }}" != "latest" ]; then
            echo "backend=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          # Rule 2: started by a release tag (refs/tags/v*) → use that version name
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"     # strip "refs/tags/" → "v1.2.3"
            echo "backend=${TAG}" >> "$GITHUB_OUTPUT"
            echo "frontend=${TAG}" >> "$GITHUB_OUTPUT"
          # Rule 3: otherwise → deploy the commit's SHA tag
          else
            SHA_SHORT="${GITHUB_SHA::7}"
            echo "backend=sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
            echo "frontend=sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-deploy snapshot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "📸 Recording current production state for rollback..."
            # save what's running BEFORE we touch anything → useful for rollback later
            cd /opt/cicd-production
            docker compose -f docker-compose.prod.yml ps > /tmp/pre-deploy-snapshot.txt || true
            docker images --format "{{.Repository}}:{{.Tag}}" >> /tmp/pre-deploy-snapshot.txt || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e                            # stop at the first failing command

            echo "Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /opt/cicd-production           # this is the PRODUCTION app folder

            echo "Pulling production images..."
            export GHCR_OWNER=${{ github.repository_owner }}
            export BACKEND_IMAGE_TAG=${{ steps.tags.outputs.backend }}
            export FRONTEND_IMAGE_TAG=${{ steps.tags.outputs.frontend }}
            docker compose -f docker-compose.prod.yml pull

            echo "Bringing up production containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting for services to stabilize..."
            sleep 15                          # prod gets a bit longer to boot

            echo "Running health checks..."
            curl -sf http://localhost:8080/api/health || { echo "❌ Production health check failed"; exit 1; }

            echo "Cleaning old images..."
            docker image prune -f

            echo "✅ Production deployed successfully"

      - name: Post deploy summary
        run: |
          echo "### 🚀 Production Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend tag:** \`${{ steps.tags.outputs.backend }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend tag:** \`${{ steps.tags.outputs.frontend }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment approved by environment protection rules**" >> $GITHUB_STEP_SUMMARY