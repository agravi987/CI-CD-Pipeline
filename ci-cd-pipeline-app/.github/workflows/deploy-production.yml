name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy (e.g. v1.2.3, sha-abc1234, latest)"
        required: false
        default: latest
  workflow_call:
    secrets:
      PROD_SSH_KEY:
        required: true
      PROD_HOST:
        required: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-frontend

jobs:
  deploy-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ] && [ "${{ github.event.inputs.version }}" != "latest" ]; then
            echo "backend=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "backend=${TAG}" >> "$GITHUB_OUTPUT"
            echo "frontend=${TAG}" >> "$GITHUB_OUTPUT"
          else
            SHA_SHORT="${GITHUB_SHA::7}"
            echo "backend=sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
            echo "frontend=sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-deploy snapshot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "📸 Recording current production state for rollback..."
            cd /opt/cicd-production
            docker compose -f docker-compose.prod.yml ps > /tmp/pre-deploy-snapshot.txt || true
            docker images --format "{{.Repository}}:{{.Tag}}" >> /tmp/pre-deploy-snapshot.txt || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e

            echo "Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /opt/cicd-production

            echo "Pulling production images..."
            export GHCR_OWNER=${{ github.repository_owner }}
            export BACKEND_IMAGE_TAG=${{ steps.tags.outputs.backend }}
            export FRONTEND_IMAGE_TAG=${{ steps.tags.outputs.frontend }}
            docker compose -f docker-compose.prod.yml pull

            echo "Bringing up production containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting for services to stabilize..."
            sleep 15

            echo "Running health checks..."
            curl -sf http://localhost:8080/api/health || { echo "❌ Production health check failed"; exit 1; }

            echo "Cleaning old images..."
            docker image prune -f

            echo "✅ Production deployed successfully"

      - name: Post deploy summary
        run: |
          echo "### 🚀 Production Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend tag:** \`${{ steps.tags.outputs.backend }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend tag:** \`${{ steps.tags.outputs.frontend }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment approved by environment protection rules**" >> $GITHUB_STEP_SUMMARY
